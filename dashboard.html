<!doctype html>
<!-- The dashboard on mini-1's screen. It loads the data.js that dashboard-data.sh writes next to it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac minis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --background:#07090e; --card:#0f141d; --line:#1d2533; --track:#1a2230;
  --text:#eef2f8; --muted:#8a95a8; --faint:#4b5568;
  --work:#8f90ff; --personal:#3fd6c3; --ok:#3ddc84; --warn:#ffb547; --critical:#ff5c6c;
  --monospace:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{overflow:hidden;background:var(--background)}
/* Laid out at the panel's 1280x400, then stretched to fill the window (fit()) */
body{position:relative;transform-origin:0 0;margin:0;width:1280px;height:400px;overflow:hidden;color:var(--text);
  font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.number{font-family:var(--monospace);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
main{position:absolute;inset:8px;display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
main.compact{grid-template-rows:1fr 1fr}

.card{position:relative;background:linear-gradient(180deg,#121926,var(--card));border:2px solid var(--line);
  border-radius:18px;padding:10px 16px 12px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .6s}
.card.hot{border-color:rgba(255,181,71,.45)}
.card.down{border-color:rgba(255,92,108,.75)}
.body{flex:1;display:flex;flex-direction:column;transition:opacity .6s,filter .6s}
.down .body{opacity:.08;filter:grayscale(1)}

/* machine row: name + CPU + MEM */
.machine-header{display:flex;align-items:center;gap:12px;height:54px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px rgba(61,220,132,.18);flex:none}
.down .dot{background:var(--critical);box-shadow:0 0 0 5px rgba(255,92,108,.25);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.name{font-size:36px;font-weight:800;letter-spacing:-.02em}
.system{margin-left:auto;display:flex;gap:16px}
.metric{display:flex;flex-direction:column;align-items:flex-end;width:96px}
.metric .value{font-size:34px;font-weight:800;line-height:1;transition:color .5s}
.metric .value small{font-size:22px;color:var(--muted);font-weight:700}
.metric .bar{margin-top:5px;width:100%;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.metric .bar i{display:block;height:100%;border-radius:3px;transition:width 1s,background .5s}
.metric .label{font-size:22px;font-weight:700;color:var(--muted);letter-spacing:.06em;line-height:1;margin-top:5px}

/* account blocks */
.account{margin-top:8px;padding-top:8px;border-top:2px solid var(--line);flex:1;display:flex;flex-direction:column;justify-content:center}
.account-header{display:flex;justify-content:space-between;align-items:baseline}
.account-header .tag{font-size:22px;font-weight:800;letter-spacing:.1em}
.account-header .five{font-size:28px;font-weight:700;color:var(--muted)}
.account-header .five b{color:var(--text)}
.account-header .five-reset{font-size:24px}
.account-figures{display:flex;align-items:baseline;justify-content:space-between;margin-top:-2px}
.week{font-size:66px;font-weight:800;line-height:1;transition:color .6s}
.week small{font-size:32px;color:var(--muted);margin-left:2px}
.week-reset{font-size:32px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.week-reset svg{width:26px;height:26px}
.week-reset b{color:var(--text)}
.critical .week-reset b{color:var(--critical)}
.critical .week{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.week-bar{margin-top:8px;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.week-bar i{display:block;height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(.3,.7,.2,1),background .6s}
.nodata .week{color:var(--faint)!important}
.nodata .week-reset{color:var(--faint)}

.off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
.down .off{opacity:1}
.off .name-row{font-size:36px;font-weight:800;display:flex;align-items:center;gap:12px}
.off .big{font-size:44px;font-weight:800;color:var(--critical);letter-spacing:.02em;margin-top:10px}
.off .small{font-size:28px;color:var(--muted);margin-top:6px}

/* compact: 4 to 6 machines, 2 rows */
.compact .card{padding:6px 14px 8px}
.compact .machine-header{height:44px}
.compact .name{font-size:30px}
.compact .metric{width:78px}.compact .metric .value{font-size:28px}
.compact .metric .label{display:none}
.compact .account{margin-top:4px;padding-top:4px;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:12px;border-top-width:1px}
.compact .account-header{width:30px}.compact .account-header .five{display:none}
.compact .account-header .tag{font-size:24px}
.compact .account-figures{flex:1;gap:10px}
.compact .week{font-size:36px}.compact .week small{font-size:22px}
.compact .week-reset{font-size:24px}.compact .week-reset svg{display:none}
.compact .five-compact{display:block;font-size:22px;color:var(--muted);font-weight:700}
.compact .week-bar{display:none}
.compact .off .name-row{font-size:28px}.compact .off .big{font-size:36px;margin-top:4px}.compact .off .small{font-size:22px}
.five-compact{display:none}
.compact .five-compact b{color:var(--text)}
</style>
</head>
<body>
<main id="grid"></main>
<script>
/* -----------------------------------------------------------------------------
/* $
/* -------------------------------------------------------------------------- */

const $ = (selector, root = document) => {
  return root.querySelector(selector);
};

/* -----------------------------------------------------------------------------
/* accountHTML
/* -------------------------------------------------------------------------- */

// The weekly limit is the big number: hitting it stops an account for days,
// the 5-hour one for hours
const accountHTML = (key, label, short, color) => {
  return `
  <div class="account" data-account="${key}">
    <div class="account-header"><span class="tag" style="color:${color}">${compact ? short : label}</span><span class="five">5h <b class="number">—</b> <span class="five-reset number"></span></span></div>
    <div class="account-figures"><span class="week number">—</span><span class="week-reset">—</span><span class="five-compact">5h <b class="number">—</b></span></div>
    <div class="week-bar"><i></i></div>
  </div>`;
};

/* -----------------------------------------------------------------------------
/* build
/* -------------------------------------------------------------------------- */

const build = (names) => {
  compact = names.length > 3;

  grid.innerHTML = '';

  cards = new Map();

  grid.classList.toggle('compact', compact);

  for (const name of names) {
    const card = document.createElement('section');

    card.className = 'card';

    card.innerHTML = `
      <div class="body">
        <div class="machine-header"><span class="dot"></span><span class="name"></span>
          <div class="system">
            <div class="metric"><span class="value number cpu">—</span><span class="bar"><i class="cpu-bar"></i></span><span class="label">CPU</span></div>
            <div class="metric"><span class="value number memory">—</span><span class="bar"><i class="memory-bar"></i></span><span class="label">MEM</span></div>
          </div></div>
        ${accountHTML('work', 'WORK', 'W', 'var(--work)')}
        ${accountHTML('personal', 'PERSONAL', 'P', 'var(--personal)')}
      </div>
      <div class="off"><div class="name-row"><span class="dot"></span><span class="name"></span></div><div class="big">UNREACHABLE</div>
        <div class="small ago">no answer yet</div></div>`;

    card.querySelectorAll('.name').forEach((nameElement) => {
      nameElement.textContent = name;
    });

    grid.appendChild(card);

    cards.set(name, card);
  }
};

let cards = new Map();

const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>`;

let compact = false;

/* -----------------------------------------------------------------------------
/* fit
/* -------------------------------------------------------------------------- */

// macOS sends the 1280x400 panel 1920x1080, which the panel squashes back.
// Stretching to the window cancels that.
const fit = () => {
  document.body.style.transform = `scale(${innerWidth / 1280},${innerHeight / 400})`;
};

/* -----------------------------------------------------------------------------
/* formatAgo
/* -------------------------------------------------------------------------- */

const formatAgo = (seconds) => {
  return seconds < 90 ? Math.round(seconds) + 's' : seconds < 5400 ? Math.round(seconds / SECONDS_PER_MINUTE) + ' min' : Math.round(seconds / SECONDS_PER_HOUR) + 'h';
};

/* -----------------------------------------------------------------------------
/* formatDay
/* -------------------------------------------------------------------------- */

const formatDay = (time) => {
  return new Date(time * MILLISECONDS_PER_SECOND)
    .toLocaleString('en-GB', {
      hour: '2-digit',
      minute: '2-digit',
      weekday: 'short',
    })
    .replace(',', '');
};

/* -----------------------------------------------------------------------------
/* formatReset
/* -------------------------------------------------------------------------- */

const formatReset = (remaining) => {
  if (remaining <= 0) return 'now';

  const hours = Math.floor(remaining / SECONDS_PER_HOUR);

  const minutes = Math.floor((remaining % SECONDS_PER_HOUR) / SECONDS_PER_MINUTE);

  const seconds = Math.floor(remaining % SECONDS_PER_MINUTE);

  return hours >= 1 ? `${hours}h${String(minutes).padStart(2, '0')}` : `${minutes}:${String(seconds).padStart(2, '0')}`;
};

const grid = $('#grid');

let layout = '';

/* -----------------------------------------------------------------------------
/* load
/* -------------------------------------------------------------------------- */

// A page opened from a file can't fetch() another file, but can load a script
const load = () => {
  const script = document.createElement('script');

  script.src = 'data.js?' + Date.now();

  script.onload = script.onerror = () => {
    script.remove();

    render();
  };

  document.head.appendChild(script);
};

const MILLISECONDS_PER_SECOND = 1000;

/* -----------------------------------------------------------------------------
/* render
/* -------------------------------------------------------------------------- */

const render = () => {
  const fleet = window.FLEET;

  if (!fleet) return;

  // Two rows of three fill the panel
  const machines = fleet.machines.slice(0, 6);

  const names = machines.map((machine) => {
    return machine.name;
  }).join(' ');

  const time = Date.now() / MILLISECONDS_PER_SECOND;

  // The collector stopped
  const stale = time - fleet.time > 30;

  if (names !== layout) {
    layout = names;

    build(names.split(' '));
  }

  for (const machine of machines) {
    const card = cards.get(machine.name);

    const up = machine.up && !stale;

    const hot = up && machine.cpu >= 85;

    if (up) seen[machine.name] = fleet.time;

    card.classList.toggle('down', !up);

    card.classList.toggle('hot', hot);

    $('.ago', card).textContent = stale ? 'dashboard not updating' : seen[machine.name] ? `last seen ${formatAgo(time - seen[machine.name])} ago` : 'no answer yet';

    if (!up) continue;

    const cpu = $('.cpu', card);

    const cpuBar = $('.cpu-bar', card);

    const memoryBar = $('.memory-bar', card);

    cpu.innerHTML = `${machine.cpu}<small>%</small>`;

    cpu.style.color = hot ? 'var(--warn)' : '';

    $('.memory', card).innerHTML = `${machine.memory}<small>%</small>`;

    cpuBar.style.width = machine.cpu + '%';

    cpuBar.style.background = hot ? 'var(--warn)' : '#5aa9ff';

    memoryBar.style.width = machine.memory + '%';

    memoryBar.style.background = machine.memory >= 90 ? 'var(--critical)' : '#c48bff';

    for (const [key, color] of [['work', 'var(--work)'], ['personal', 'var(--personal)']]) {
      const account = machine.claude[key] || {};

      const box = $(`[data-account="${key}"]`, card);

      const bar = $('.week-bar i', box);

      const five = account.five;

      const has = account.week != null;

      const week = $('.week', box);

      box.classList.toggle('nodata', !has);

      box.classList.toggle('critical', has && account.week >= 90);

      for (const fiveLabel of [$('.five b', box), $('.five-compact b', box)]) {
        fiveLabel.textContent = five != null ? five + '%' : '—';

        fiveLabel.style.color = severityColor(five, '');
      }

      $('.five-reset', box).textContent = five != null && account.fiveReset ? formatReset(account.fiveReset - time) : '';

      if (!has) {
        week.innerHTML = '—';

        $('.week-reset', box).textContent = 'no recent use';

        bar.style.width = '0';

        continue;
      }

      week.innerHTML = `${account.week}<small>%</small>`;

      week.style.color = severityColor(account.week, 'var(--text)');

      $('.week-reset', box).innerHTML = account.weekReset ? `${clockIcon}<b class="number">${formatDay(account.weekReset)}</b>` : '';

      bar.style.width = account.week + '%';

      bar.style.background = severityColor(account.week, color);
    }
  }
};

const SECONDS_PER_HOUR = 3600;

const SECONDS_PER_MINUTE = 60;

// When each machine last answered
const seen = {};

/* -----------------------------------------------------------------------------
/* severityColor
/* -------------------------------------------------------------------------- */

const severityColor = (percent, base) => {
  return percent >= 90 ? 'var(--critical)' : percent >= 75 ? 'var(--warn)' : base;
};

addEventListener('resize', fit);

fit();

load();

setInterval(load, 5000);

// The countdowns tick between loads
setInterval(render, 1000);
</script>
</body>
</html>
