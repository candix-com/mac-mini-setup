<!doctype html>
<!-- The dashboard on mini-1's screen. It loads the data.js that machines-dashboard.sh writes next to it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac minis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090e; --card:#0f141d; --line:#1d2533; --trk:#1a2230;
  --text:#eef2f8; --muted:#8a95a8; --faint:#4b5568;
  --work:#8f90ff; --pers:#3fd6c3; --ok:#3ddc84; --warn:#ffb547; --crit:#ff5c6c;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
/* Laid out at the panel's 1280x400, then stretched to fill the window (fit()) */
body{position:relative;transform-origin:0 0;margin:0;width:1280px;height:400px;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
main{position:absolute;inset:8px;display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
main.compact{grid-template-rows:1fr 1fr}

.card{position:relative;background:linear-gradient(180deg,#121926,var(--card));border:2px solid var(--line);
  border-radius:18px;padding:10px 16px 12px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .6s}
.card.hot{border-color:rgba(255,181,71,.45)}
.card.down{border-color:rgba(255,92,108,.75)}
.body{flex:1;display:flex;flex-direction:column;transition:opacity .6s,filter .6s}
.down .body{opacity:.08;filter:grayscale(1)}

/* machine row: name + CPU + MEM */
.mh{display:flex;align-items:center;gap:12px;height:54px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px rgba(61,220,132,.18);flex:none}
.down .dot{background:var(--crit);box-shadow:0 0 0 5px rgba(255,92,108,.25);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.name{font-size:36px;font-weight:800;letter-spacing:-.02em}
.sys{margin-left:auto;display:flex;gap:16px}
.met{display:flex;flex-direction:column;align-items:flex-end;width:96px}
.met .v{font-size:34px;font-weight:800;line-height:1;transition:color .5s}
.met .v small{font-size:22px;color:var(--muted);font-weight:700}
.met .bar{margin-top:5px;width:100%;height:6px;border-radius:3px;background:var(--trk);overflow:hidden}
.met .bar i{display:block;height:100%;border-radius:3px;transition:width 1s,background .5s}
.met .k{font-size:22px;font-weight:700;color:var(--muted);letter-spacing:.06em;line-height:1;margin-top:5px}

/* account blocks */
.acct{margin-top:8px;padding-top:8px;border-top:2px solid var(--line);flex:1;display:flex;flex-direction:column;justify-content:center}
.al{display:flex;justify-content:space-between;align-items:baseline}
.al .tag{font-size:22px;font-weight:800;letter-spacing:.1em}
.al .wk{font-size:28px;font-weight:700;color:var(--muted)}
.al .wk b{color:var(--text)}
.al .r5{font-size:24px}
.ar{display:flex;align-items:baseline;justify-content:space-between;margin-top:-2px}
.p5{font-size:66px;font-weight:800;line-height:1;transition:color .6s}
.p5 small{font-size:32px;color:var(--muted);margin-left:2px}
.rs{font-size:32px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.rs svg{width:26px;height:26px}
.rs b{color:var(--text)}
.crit .rs b{color:var(--crit)}
.crit .p5{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.pb{margin-top:8px;height:8px;border-radius:4px;background:var(--trk);overflow:hidden}
.pb i{display:block;height:100%;border-radius:4px;transition:width 1.2s cubic-bezier(.3,.7,.2,1),background .6s}
.nodata .p5{color:var(--faint)!important}
.nodata .rs{color:var(--faint)}

.off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
.down .off{opacity:1}
.off .nm{font-size:36px;font-weight:800;display:flex;align-items:center;gap:12px}
.off .big{font-size:44px;font-weight:800;color:var(--crit);letter-spacing:.02em;margin-top:10px}
.off .small{font-size:28px;color:var(--muted);margin-top:6px}

/* compact: 4–6 machines, 2 rows */
.compact .card{padding:6px 14px 8px}
.compact .mh{height:44px}
.compact .name{font-size:30px}
.compact .met{width:78px}.compact .met .v{font-size:28px}.compact .met .v small{font-size:22px}
.compact .met .k{display:none}
.compact .acct{margin-top:4px;padding-top:4px;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:12px;border-top-width:1px}
.compact .al{order:0;width:30px}.compact .al .wk{display:none}
.compact .al .tag{font-size:24px}
.compact .ar{flex:1;gap:10px}
.compact .p5{font-size:36px}.compact .p5 small{font-size:22px}
.compact .rs{font-size:24px}.compact .rs svg{display:none}
.compact .wk2{display:block!important;font-size:22px;color:var(--muted);font-weight:700}
.compact .pb{display:none}
.compact .off .nm{font-size:28px}.compact .off .big{font-size:36px;margin-top:4px}.compact .off .small{font-size:22px}
.wk2{display:none}
.compact .wk2 b{color:var(--text)}
</style>
</head>
<body>
<main id="grid"></main>
<script>
const $ = (s, r=document) => r.querySelector(s);
const now = () => Date.now()/1000;
let COMPACT = false;

const sevColor = (p, base) => p>=90 ? 'var(--crit)' : p>=75 ? 'var(--warn)' : base;
const loadColor = p => p>=85 ? 'var(--warn)' : '#5aa9ff';
function fmtReset(sec){
  if (sec <= 0) return 'now';
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  return h >= 1 ? `${h}h${String(m).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtDay(t){
  return new Date(t*1000).toLocaleString('en-GB', {weekday:'short', hour:'2-digit', minute:'2-digit'}).replace(',', '');
}
function fmtAgo(s){ return s < 90 ? Math.round(s) + 's' : s < 5400 ? Math.round(s/60) + ' min' : Math.round(s/3600) + 'h'; }

// ---------------------------------------------------------------- DOM
const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>`;
// The weekly limit is the big number: hitting it stops an account for days, the 5-hour one for hours
const acctHTML = (k, label, short, col) => `
  <div class="acct" data-a="${k}">
    <div class="al"><span class="tag" style="color:${col}">${COMPACT?short:label}</span><span class="wk">5h <b class="num">—</b> <span class="r5 num"></span></span></div>
    <div class="ar"><span class="p5 num">—</span><span class="rs">—</span><span class="wk2">5h <b class="num">—</b></span></div>
    <div class="pb"><i></i></div>
  </div>`;
const grid = $('#grid');
let cards = new Map(), layout = '';
const seen = {};   // when each machine last answered
function build(names){
  COMPACT = names.length > 3;
  grid.innerHTML = ''; cards = new Map();
  grid.classList.toggle('compact', COMPACT);
  for (const name of names){
    const el = document.createElement('section'); el.className = 'card';
    el.innerHTML = `
      <div class="body">
        <div class="mh"><span class="dot"></span><span class="name"></span>
          <div class="sys">
            <div class="met"><span class="v num cpu">—</span><span class="bar"><i class="cb"></i></span><span class="k">CPU</span></div>
            <div class="met"><span class="v num mem">—</span><span class="bar"><i class="mb"></i></span><span class="k">MEM</span></div>
          </div></div>
        ${acctHTML('work','WORK','W','var(--work)')}
        ${acctHTML('pers','PERSONAL','P','var(--pers)')}
      </div>
      <div class="off"><div class="nm"><span class="dot"></span><span class="name"></span></div><div class="big">UNREACHABLE</div>
        <div class="small ago">no answer yet</div></div>`;
    el.querySelectorAll('.name').forEach(n => n.textContent = name);
    grid.appendChild(el); cards.set(name, el);
  }
}

// ---------------------------------------------------------------- render
function render(){
  const f = window.FLEET, t = now();
  if (!f) return;
  const machines = f.machines.slice(0, 6);
  const names = machines.map(m => m.name);
  if (names.join(' ') !== layout){ layout = names.join(' '); build(names); }
  // The collector stopped
  const stale = t - f.t > 30;
  for (const m of machines){
    const el = cards.get(m.name), up = m.up && !stale;
    if (up) seen[m.name] = f.t;
    el.classList.toggle('down', !up);
    el.classList.toggle('hot', up && m.cpu >= 85);
    $('.ago', el).textContent = stale ? 'dashboard not updating' : seen[m.name] ? `last seen ${fmtAgo(t - seen[m.name])} ago` : 'no answer yet';
    if (!up) continue;
    const cpu = $('.cpu', el); cpu.innerHTML = `${m.cpu}<small>%</small>`; cpu.style.color = m.cpu >= 85 ? 'var(--warn)' : '';
    $('.mem', el).innerHTML = `${m.mem}<small>%</small>`;
    const cb = $('.cb', el); cb.style.width = m.cpu + '%'; cb.style.background = loadColor(m.cpu);
    const mb = $('.mb', el); mb.style.width = m.mem + '%'; mb.style.background = m.mem >= 90 ? 'var(--crit)' : '#c48bff';
    for (const [k, col] of [['work', 'var(--work)'], ['pers', 'var(--pers)']]){
      const a = m[k], box = $(`[data-a="${k}"]`, el);
      const has = a.week != null;
      box.classList.toggle('nodata', !has);
      box.classList.toggle('crit', has && a.week >= 90);
      const big = $('.p5', box), bar = $('.pb i', box);
      const five = a.five;
      for (const b of [$('.wk b', box), $('.wk2 b', box)]){
        b.textContent = five != null ? five + '%' : '—';
        b.style.color = five >= 90 ? 'var(--crit)' : five >= 75 ? 'var(--warn)' : '';
      }
      $('.r5', box).textContent = five != null && a.r5 ? fmtReset(a.r5 - t) : '';
      if (!has){
        big.innerHTML = '—';
        $('.rs', box).textContent = 'no recent use';
        bar.style.width = '0';
        continue;
      }
      big.innerHTML = `${a.week}<small>%</small>`;
      big.style.color = sevColor(a.week, 'var(--text)');
      $('.rs', box).innerHTML = a.rw ? `${clockIcon}<b class="num">${fmtDay(a.rw)}</b>` : '';
      bar.style.width = a.week + '%'; bar.style.background = sevColor(a.week, col);
    }
  }
}

// ---------------------------------------------------------------- fit
// macOS sends the 1280x400 panel 1920x1080, which the panel squashes back. Stretching to the window cancels that.
function fit(){ document.body.style.transform = `scale(${innerWidth/1280},${innerHeight/400})`; }
addEventListener('resize', fit); fit();

// ---------------------------------------------------------------- data
// A page opened from a file can't fetch() another file, but it can load one as a script
function load(){
  const s = document.createElement('script');
  s.src = 'data.js?' + Date.now();
  s.onload = s.onerror = () => { s.remove(); render(); };
  document.head.appendChild(s);
}
load();
setInterval(load, 5000);
setInterval(render, 1000);   // the countdowns tick between loads
</script>
</body>
</html>
